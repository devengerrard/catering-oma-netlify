[build]
  publish = "public"
  functions = "netlify/functions"

# Redirect API calls to functions
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Catch-all redirect to index.html for smooth client-side navigation
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
