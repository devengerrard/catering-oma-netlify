[build]
  publish = "public"
  functions = "netlify/functions"

# Redirects API requests to serverless functions
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Single Page Application / Fallback rewrite
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
